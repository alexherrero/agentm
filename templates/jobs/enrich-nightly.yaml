# enrich-nightly.yaml — the nightly enrichment batch (agentm-vault, the capture
# writers).
#
# Registered and off. The eager trigger — a model call per note as the note
# landed — retired with the capture writers; the batch is what replaces it,
# doing the same work in one place, under a budget, with a report. The night's
# plan (agentm-vault plan 04) set what the pass does: it walks the cards in
# the contract's class directories, runs each on the tier the tier table
# routes it to, spends against the operator's line — a million tokens on the
# strong tier or two million on the cheap tier, with a 250-call guard, the
# binary's own defaults — and prints each call's usage and the night's total.
# It stays off until the operator has read the first supervised batch.
#
# .harness/jobs/ is gitignored (per-project runtime state, same as every other
# .harness/* file), so this templates/ copy is the tracked, shipped source.
# Register it by copying to .harness/jobs/enrich-nightly.yaml in a repo that
# runs the agentm runner (scripts/agentm-runner.sh).
#
# **Turning it on is two edits, and they belong together**: `enabled: true`
# here, and `daemon.enrich_enabled true` in the kernel config
# (`agentm_config.py --enrich-enabled true`). Either alone does nothing —
# `enabled: true` schedules a command that refuses while the switch is off, and
# the switch alone arms a pass with nothing scheduled to call it. See the
# `command:` note below for what that depends on.
schedule: daily
lookback: 36h

# The night (agentm-vault plan 04): the four nightly steps start inside
# 02:00-06:00 local and run in this order — enrichment, the binary, the Python
# cycle, the scorecards — because each reads what the one before it wrote.
window: "02:00-06:00"
order: 1

# Registered and off. `enabled: false` is not `dry_run: true`: a dry run still
# runs the command and asks it not to write. This job stays off until the
# operator has read the twenty before-and-after pairs from the first
# supervised batch, and only their word turns it on. The cycle skips it by
# name, so it is visible in the report rather than forgotten.
enabled: false

# Runs from `scripts/` as cwd (agentm-runner.sh's invocation convention).
#
# **No `--yes`, deliberately.** That flag bypasses `daemon.enrich_enabled`
# outright — it exists so a person can run one batch by hand without throwing
# the standing switch. In a *scheduled* command it would defeat the one flag
# whose whole point is that spending is never turned on by anything but an
# operator's own decision: the job would spend every night with the switch
# still off. Without it, the command refuses until the switch is thrown, which
# is what makes the two edits above genuinely need each other.
#
# No budget flags either: the binary's defaults are the operator's line, and
# a flag may only lower it. The last line the command prints is a JSON object
# carrying `total_cost_usd`, which is what the runner's spend line reads.
# The runner exports $MEMORY_ROOT as the memory root (agentm-runner.sh), and
# agentmd reads it as exactly that, deriving the vault root above it from the
# configured memory_root (2026-09-11). Until then the daemon read the same
# variable as the vault root, the batch built its queue one level too deep and
# found nothing to judge, every night, with no error — and this command hid
# the variable from it with `env -u`. That workaround is gone with the split:
# the command runs under the runner's environment like every other job.
command: $HOME/.local/bin/agentmd enrich

# Spends model calls, over the operator's own corpus, unattended. The same tier
# every other job that calls a model carries.
tier: T3

# Declared so the runner knows this job spends: the fleet's daily dollar
# ceiling (`.harness/budget.yaml`, $5 when unset) gates only jobs that declare
# a budget, and reads the past day's reported cost. The number is the night's
# line; the binary enforces the line itself, per tier, from each call's
# own usage.
budget:
  tokens: 2000000

# Not a dry run when it is eventually turned on: the pass's whole job is to
# write, and its own gates — eligibility by stamp, the fingerprint key, the
# confidence floor — are what make that safe. A dry-run nightly enrichment
# would print a queue every night and enrich nothing.
dry_run: false
