# dreaming.yaml — the dreaming binary's scheduled trigger (filing v2 part 6,
# task 3). The runner fires it often; the binary's own dual gate decides
# whether a pass is due — enough time since the last pass AND activity since
# (captures, genuine recalls) — and exits at once when it is not. Triggered-
# and-exits, lock-coordinated, journaled: never a resident process.
#
# Register it by copying to .harness/jobs/dreaming.yaml in the repo that runs
# the agentm runner (scripts/agentm-runner.sh), beside dream.yaml, which keeps
# running the Python layer. The binary is report-only until the parity gate
# (task 6) flips `-apply`: it decides, prints, journals its run, and touches
# no note. `-every` is the binary's own interval; the runner's `schedule` is
# only how often it is asked.
schedule: daily
lookback: 3d

# The night (agentm-vault plan 04): the four nightly steps start inside
# 02:00-06:00 local and run in this order — enrichment, the binary, the Python
# cycle, the scorecards — because each reads what the one before it wrote.
window: "02:00-06:00"
order: 2

# The runner runs from `scripts/`; the binary reads the kernel config for the
# vault, and $AGENTM_STATE_DIR (or ~/.local/state/agentm) for its state,
# journal and lock. Report-only: no `-apply` until the parity gate.
# Applying since 2026-09-05 (filing v2 part 6): the binary owns the
# lifecycle policy, copies, refile, promote, the calendar reviews, the MOCs
# and the date glosses. Dropping `-apply` returns it to report-only — a
# rollback that mutates nothing; the Python lanes it replaced are gone.
# One YAML scalar, quoted whole: a value that starts with a quote and keeps
# going is a parse error, and one bad manifest stops every job the runner
# has (it loads them all or none). The shell expands $HOME at run time.
#
# Nightly (agentm-vault plan 04), so the maps and the copy collapse follow the
# night's judgments instead of lagging a week. The runner's window is what
# makes it once a night; `-every` only has to sit between the two gaps it could
# be confused by. It runs after enrichment, which takes from minutes to its
# three-and-a-half-hour limit, so two nights' passes can start as little as
# about nineteen hours apart — a literal `-every 24h` would skip every night
# that started earlier than the one before. Twelve hours is shorter than that
# and longer than any one night, so a hand-run `-apply` in the afternoon is
# still refused and no night is skipped. A report-only pass no longer moves
# the clock, so a diagnostic run by hand costs the night nothing.
command: "$HOME/.local/bin/agentmdream run -every 12h -apply"

# T3: the agent's own memory maintenance, no model calls in this scaffold.
tier: T3

# No `budget:` — the pass makes no LLM calls.
dry_run: false
