# dreaming-divergence.yaml — the overlap window's daily divergence review
# (filing v2 part 6, task 6).
#
# While the dreaming binary runs report-only beside the Python layer, this
# job runs both over a copy of the live memory root and writes a dated note
# under <memory root>/diagnostics/dreaming/ naming every decision the two
# layers disagree on — counts and paths, verbatim, no adjectives, no
# auto-disposition. A clean note says so. The window closes when the
# operator dispositions the divergences in writing and flips the two
# manifests together: `-apply` in dreaming.yaml, `--skip-ported` in
# dream.yaml. Register by copying to .harness/jobs/ beside the others.
schedule: daily
lookback: 3d

# Runs from `scripts/`; reads MEMORY_VAULT_PATH from the runner's environment.
command: python3 health/dreaming_divergence.py --write

tier: T2

# No `budget:` — no model calls; two deterministic passes and a diff.
dry_run: false
