# dream.yaml — the Python half of the night (AG Wave E, PLAN-wave-e-dreaming
# task 4; reshaped in agentm-vault plan 04).
#
# Per agentm-runner.md's job-manifest contract — the as-built schema is
# scripts/runner/manifest.py, which this file follows.
#
# .harness/jobs/ is gitignored (per-project runtime state, same as every
# other .harness/* file — see .gitignore), so this templates/ copy is the
# tracked, shipped source. Register it by copying to .harness/jobs/dream.yaml
# in a repo that runs the agentm runner (scripts/agentm-runner.sh). A repo
# that already has a live copy edits it in place rather than recopying this
# one over it.
#
# What it runs (agentm-vault plan 04): the step of the night that reads,
# reports and proposes, and changes no note. The filing contract, read first
# and fail-closed; the corpus meters; lint as a report; possible twins (dedup
# at 0.92) and shared keys (contradiction triage); proposed facets; the
# enrichment breaker's status and the correction loop. The twins, the shared
# keys and the facets become sections of the needs-review map, and the cycle
# report feeds the morning note. Everything that applied or staged anything —
# lifecycle, compression, tidying, lint repair, the opinion supplement,
# insights and qualification, the sampled audit, entity rollups, stub
# synthesis, the unfiled drain, the confirm-and-revert path — retired in
# plan 04; the dreaming binary carries the lanes that write.
#
# Nightly, because the needs-review map and the morning note read what it
# leaves, and a weekly cycle left them a week stale.
schedule: daily
lookback: 3d

# The night (agentm-vault plan 04): the four nightly steps start inside
# 02:00-06:00 local and run in this order — enrichment, the binary, the Python
# cycle, the scorecards — because each reads what the one before it wrote.
window: "02:00-06:00"
order: 3

# Runs from `scripts/` as cwd (agentm-runner.sh's invocation convention).
# Relies on MEMORY_VAULT_PATH already being set in the runner's own
# environment, same as every other vault-reading script in this repo. No
# `--batch-cap`: the cycle applies nothing, so there is nothing to cap (the
# flag is still accepted, so a live copy that passes it keeps running).
command: python3 ../harness/skills/memory/scripts/dream.py

# T3: what it writes is the agent's own — the needs-review map, and its
# findings and report under the engine state dir. No note is written.
tier: T3

# No `budget:` — the cycle makes zero model calls; it is stdlib-only
# deterministic heuristics (difflib similarity, frontmatter matching).

# The shipped posture stays dry-run: a repo that copies this in turns it on
# by flipping this to false, on its own decision. It writes no note either
# way, so the flip only decides whether the map and the morning note get the
# cycle's findings.
dry_run: true
