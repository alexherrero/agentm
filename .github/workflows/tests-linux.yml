name: "[T] Linux Tests"

# Worktree-native flow (ratified 2026-07-06): the full battery now gates on
# pull_request, not push to main — main only ever merges a PR whose required
# checks already passed. pull_request deliberately carries no paths-ignore
# (a required check that a trigger-level filter can skip would block a
# docs-only PR's merge forever); the docs/wiki diet returns as a job-level
# no-op under PLAN-per-plan-ci. push keeps its diet — it now runs only the
# light `syntax` job below (every other job is pull_request-only).
on:
  push:
    branches: [main]
    paths-ignore:
      - 'wiki/**'
      - '**/*.md'
  pull_request: {}
  workflow_dispatch: {}  # L7: lets health-nightly.yml force a real run against
    # a bot-pushed branch — GitHub gates pull_request-triggered required
    # checks behind action_required when the triggering push is GITHUB_TOKEN,
    # not a human; workflow_dispatch is exempt from that suppression.
    # L7 follow-up: workflow_dispatch carries no `inputs.full_battery` (only
    # workflow_call declares that input) — every job below is gated `if:
    # github.event_name == 'pull_request' || ... || inputs.full_battery`, so
    # a first-cut dispatch silently skipped the whole battery except this
    # file's ungated jobs (caught live: the manual proof-run's tests-mac/
    # tests-windows dispatches both came back "skipped", not "success").
    # Each gate now also matches `workflow_dispatch` explicitly.
  workflow_call:
    inputs:
      full_battery:
        type: boolean
        default: true

jobs:
  install-smoke:
    name: install-smoke
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || inputs.full_battery
    steps:
      - uses: actions/checkout@v4
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Run smoke-install (bash) + post-install integrity
        run: bash scripts/smoke-install-bash.sh

  adapter-parity:
    name: adapter-parity
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || inputs.full_battery
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-parity.sh

  validate:
    name: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || inputs.full_battery
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
      - name: Build agentmd (the filing contract's only parser)
        # The daemon owns the storage-rules parser, and the Python gates and
        # tests below ask it rather than parsing the file a second time. Built
        # from this tree, and $AGENTMD points at it, so the checks grade this
        # diff instead of whatever binary a runner happens to have.
        run: |
          go -C daemon build -o "$RUNNER_TEMP/agentmd" ./cmd/agentmd
          echo "AGENTMD=$RUNNER_TEMP/agentmd" >> "$GITHUB_ENV"
      - name: Install Python deps
        # sentence-transformers is deliberately NOT installed (1.3GB+; the
        # e2e uses stub embed mode). fastmcp lets verify-mcp-surface.py + the
        # auto-discovered test_memory_mcp_tools.py actually run instead of
        # gracefully skipping — R1.6, this was previously never installed
        # anywhere, so those MCP contract checks silently never ran.
        run: pip install pyyaml fastmcp
      - name: Validate adapter frontmatter / TOML / JSON
        run: python3 scripts/validate-adapters.py
      - name: Check cross-references + hook-fragment schema parity
        run: python3 scripts/check-references.py
      - name: Lint wiki (Diátaxis / ADR 0004)
        run: python3 scripts/check-wiki.py --strict
      - name: check-personas (requires ⊆ substrate + no-always-load)
        run: python3 scripts/check-personas.py
      - name: "check-governs-index (governs:/area: overlap + unknown-area)"
        run: python3 scripts/check-governs-index.py
      - name: check-vendored-parity (hook-config mode — 4 hook _resolve_vault_path copies)
        run: bash scripts/check-vendored-parity.sh hook-config
      - name: check-storage-rules (the filing contract parses + the taxonomy growth rule)
        # Runs in full on CI: the packaged default is in the repo, so the parse
        # assertion is real here, and the growth rule diffs the taxonomy against
        # the merge base. Only the live vault instance is unreachable, and its
        # absence is a documented skip rather than a silent pass.
        run: python3 scripts/check-storage-rules.py
      - name: check-vault-frontmatter (self-test — the scanner's own defect classes)
        # The gate's scan mode walks the operator's vault, which a runner does
        # not have, so on CI it would skip and prove nothing. --self-test builds
        # a scratch vault of known-bad notes instead and asserts each defect is
        # caught at the expected file:line. check-all.sh runs the scan mode
        # locally, against the real vault.
        run: python3 scripts/check-vault-frontmatter.py --self-test
      - name: Unit tests — auto-discover every scripts/test_*.py
        # v4.5.1 task 1: use unittest discover so new test files are picked
        # up without a workflow edit. Closes pre-v4.5.1 CI gap where
        # test_install_migrate.py was invisible.
        # Subshell `cd` because scripts/ lacks __init__.py (regular package
        # required for discover from a non-cwd start dir).
        run: (cd scripts && python3 -m unittest discover -p 'test_*.py')
      - name: V4 push-surface integration check (verify-v4.sh)
        # End-to-end check of the auto-orchestration surface (briefing · idle ·
        # phase-dispatch · nudges · config/state) against a throwaway scratch
        # vault. Complements the unit suite; grows with the push surface.
        run: bash scripts/verify-v4.sh
      - name: check-vendored-parity (vault-lock mode)
        # The two copies of the vault-write protocol — scripts/vault_lock.py and
        # its vendored twin harness/skills/memory/scripts/vault_lock.py — must
        # stay sha256-identical (testInfra#0: was check-all.sh-only, invisible to CI).
        run: bash scripts/check-vendored-parity.sh vault-lock
      - name: verify-orchestration-briefing (PM-half integration check)
        # PM-owned orchestration signals (briefing · HIGH watchlist · incubator ·
        # idea-ledger · staged-adapt · both nudges) against a throwaway scratch
        # vault (testInfra#1: was check-all.sh-only, invisible to CI).
        run: bash scripts/verify-orchestration-briefing.sh
      - name: verify-idle-chain (non-dry-run chain + post-release dispatch)
        # Issue #71 (Hardening I #45 follow-up): verify-v4.sh section E only ever
        # asserted the idle chain's DRY-RUN plan, so every step could no-op
        # forever and stay green. This runs the same chain for real against a
        # scratch vault + scratch transcript root and asserts the mutations —
        # the saved entry, the advanced seen-state, the staged candidates, the
        # recorded cooldown — plus a real post-release dispatch. Hermetic: no
        # network (empty discovery whitelist + seeded cadence, no GitHub links
        # in the adapt fixture), no real vault, no real transcripts. CI runs
        # WITHOUT the fault (VERIFY_IDLE_CHAIN_FAULT=dry-run is the manual
        # regression check, same convention as the sibling verify scripts).
        run: bash scripts/verify-idle-chain.sh
      - name: verify-hook-resolution (dual-key vault_path read, 4 hooks)
        # Regression guard for the hook config dual-key read (R1.2 / agentmEngine#0):
        # a scratch HOME with .agentm-config.json carrying ONLY the plugin-namespaced
        # vault key must still resolve for all four memory hooks.
        run: bash scripts/verify-hook-resolution.sh
      - name: verify-state-routing (backend x project-mode matrix, never-demote)
        # R1.3 / agentmEngine#1: the backend x project-mode routing matrix +
        # the never-demote guard (explicit storage.backend=vault + a broken
        # vault path must fail loud, never silently write repo-local).
        run: bash scripts/verify-state-routing.sh
      - name: verify-reflection (tri-lane routing, machine-source filter)
        # R1.5 / agentmExperience#2 (R0.3 fix): a genuine operator preference
        # classifies HIGH and auto-saves; a subagents/-path transcript never
        # contributes to the vault even carrying the same still-HIGH pattern,
        # across all three --route-mode values.
        run: bash scripts/verify-reflection.sh
      - name: verify-dreaming (stage->confirm->revert-log e2e, no-silent-apply-on-timeout)
        # PLAN-wave-e-dreaming task 4: a manual /dream run against a seeded
        # corpus stages a dedup proposal without mutating any source file;
        # confirm() applies it through revert_log and the same RevertLog can
        # undo it (proves apply routes through the journal, not a direct
        # write); an expired proposal's confirm() raises and never applies
        # (no silent apply on timeout); the shipped job manifest
        # (templates/jobs/dream.yaml) parses and stays dry_run: true.
        run: bash scripts/verify-dreaming.sh
      - name: verify-declare-a-type (contract edit -> coverage falls -> queue -> climbs)
        # PLAN-dreaming-ledger-and-sources task 9, across the seam rather than
        # inside it: a corpus enriched under one filing contract reads as fully
        # covered; declaring a type changes the contract hash; coverage falls
        # to zero over the same population with every item reading `stale`
        # rather than `changed` and naming the contract; the discovery stages
        # enqueue both re-enrichment and rollup work into the daemon's own
        # queue under their budgets; and re-enrichment brings coverage back.
        # Drives the built binary and the shipped harness scripts — a flag or
        # JSON-field change breaks the harness without breaking a Go test.
        run: bash scripts/verify-declare-a-type.sh
      - name: verify-auto-org-meters (connectivity + browse-surface e2e)
        # PLAN-auto-org-dedup-and-lint.md task 8: a fixture cycle with a
        # linked pair, an unlinked note, a shelved artifact, and an
        # archived memory reports the correct organic-connectivity ratio
        # and three-state browse-surface counts through run_dream(), both
        # in corpus_stats and rendered in the digest; the archived note's
        # content stays readable on disk (the plan's own acceptance test).
        run: bash scripts/verify-auto-org-meters.sh
      - name: verify-opinion-supplements (accumulate loop Stages 2-3 e2e)
        # wiki/designs/agentm-experience-and-dreaming.md's accumulate-loop
        # section, ten locked calls: a two-distinct-session lane stages a
        # confirm-gated opinion_promote proposal (never auto-applied);
        # confirming it applies through revert_log and opinion_resolver
        # reads the served supplement back; a direct base contradiction on
        # a shared anchor never gets served and is recorded in
        # _meta/opinion-base-proposals.json; the health pointer and
        # console.section_opinion_supplements render it.
        run: bash scripts/verify-opinion-supplements.sh
      - name: verify-mcp-surface (append/search/forget round-trip, dead-surface fate)
        # R1.6 / agentmEngine#2: an in-process FastMCP client drives the real
        # append->search->forget round-trip, soft-delete semantics, and the
        # three dead-recall-surface fates (memory_recall + recall_here
        # retired; documenter_context's V5-3 stub contract locked).
        run: python3 scripts/verify-mcp-surface.py
      - name: health-score-determinism (scorecard byte-identical across two runs)
        # R1.8 Task 1: the health scorecard aggregator must be deterministic —
        # two runs against the same fixture input produce byte-identical markdown.
        run: python3 scripts/health/health_score.py --check-determinism --path scripts/health/fixtures/sample-records.jsonl
      - name: validate-audit-coverage (4 in-scope mythos-readiness blockers detectable)
        # R1.8 Task 3: proves the regression net catches what the audit caught
        # by hand, for the 5 of 11 verified blockers with code presence in
        # this repo (the other 6 are crickets-repo code or doc/content
        # staleness — out of an agentm verify script's reach; see the
        # script's own header for the full breakdown).
        run: bash scripts/health/validate-audit-coverage.sh
      - name: run-ablation-baseline (mechanical uplift, on/off per subsystem)
        # PLAN-r3-uplift-scoring task 2 (R3.1b): runs each of the four R3.1a
        # subsystems' verify script on/off, scores both through health_score.py,
        # emits an ablation record. Deterministic, no live model calls — the
        # evidence-tracker record gracefully skips here (no crickets sibling
        # checkout in this repo's CI); its own gate lives in crickets check-all.sh.
        run: bash scripts/health/run-ablation-baseline.sh
      - name: Phase-lifecycle e2e, both state modes (verify-phases.sh)
        # Drives /setup→/plan→/work→/release deterministic seams against a
        # fixture project, once vault-resident + once repo-local (Hardening I #45).
        run: bash scripts/verify-phases.sh
      - name: Memory-engine round-trip e2e (verify-memory-roundtrip.sh)
        # embed(stub)→save→recall→reflect→lint on a fixture vault.
        run: bash scripts/verify-memory-roundtrip.sh

  syntax:
    name: syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n on every .sh
        run: bash scripts/check-syntax.sh
      - name: AST-parse every .ps1 (pwsh ships on ubuntu-latest)
        shell: pwsh
        run: pwsh -NoProfile -File scripts/check-syntax.ps1

  lib-parity:
    name: lib-parity
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || inputs.full_battery
    steps:
      - uses: actions/checkout@v4
      - name: Verify lib/install/ matches committed checksums
        run: bash scripts/check-vendored-parity.sh lib

  pii-guardrails:
    name: pii-guardrails
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || inputs.full_battery
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks needs full history so it can walk back to the parent
          # commit when scanning a push (gitleaks-action runs
          # `git log ...<base>^..<head>`). Default shallow checkout (depth=1)
          # breaks the `^` walk with "unknown revision" — see actions/checkout
          # docs.
          fetch-depth: 0
      - name: Run check-no-pii.sh (regex scanner)
        run: bash scripts/check-no-pii.sh --all
      - name: Run gitleaks (industry-standard secret scanner)
        uses: gitleaks/gitleaks-action@v2
        with:
          config-path: .gitleaks.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

