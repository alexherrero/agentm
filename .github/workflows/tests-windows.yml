name: "[T] Windows Tests"

# Worktree-native flow (ratified 2026-07-06): gates on pull_request, not push
# to main (main only merges a PR whose required checks already passed).
# pull_request carries no paths-ignore — a required check a trigger-level
# filter could skip would block a docs-only PR's merge forever; the diet
# returns as a job-level no-op under PLAN-per-plan-ci. push runs nothing here
# (no light-weight subset of this job exists); tests-linux.yml's `syntax`
# job is the one light check that still runs on push.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'wiki/**'
      - '**/*.md'
  pull_request: {}
  workflow_dispatch: {}  # L7: exempt from GITHUB_TOKEN's no-recursive-trigger
    # suppression — see tests-linux.yml's comment for why this is needed.
  workflow_call:
    inputs:
      full_battery:
        type: boolean
        default: true

jobs:
  install-smoke:
    name: install-smoke
    runs-on: windows-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || inputs.full_battery
    steps:
      - uses: actions/checkout@v4
      # windows-latest ships pwsh 7+ and Python preinstalled.
      - name: Install Python deps (for validate script)
        # sqlite-vec lets verify-memory-roundtrip.sh exercise the vec-index
        # nearest-neighbor read-back on Windows too; the e2e self-skips it
        # if the runner's Python can't load extensions (enhancement, never
        # a hard dep) — same convention tests-mac.yml already uses.
        run: python -m pip install pyyaml sqlite-vec
      - name: Run smoke-install (pwsh) + post-install integrity
        shell: pwsh
        run: pwsh -NoProfile -File scripts/smoke-install-pwsh.ps1
      - name: Run test-install (pwsh) — installer-boundary guard
        shell: pwsh
        run: pwsh -NoProfile -File scripts/test-install.ps1
      - name: Validate adapter frontmatter / TOML / JSON (cross-platform)
        run: python scripts/validate-adapters.py
      - name: Check cross-references + hook-fragment schema parity
        run: python scripts/check-references.py
      - name: AST-parse every .ps1
        shell: pwsh
        run: pwsh -NoProfile -File scripts/check-syntax.ps1
      # bash -n skipped on Windows (git-bash is present but path-mangling
      # makes find(1) unreliable; Linux + Mac cover .sh parse).
      - name: Verify lib/install/ checksums
        shell: bash
        run: bash scripts/check-vendored-parity.sh lib
      - name: Run check-no-pii.sh
        shell: bash
        run: bash scripts/check-no-pii.sh --all
      - name: check-personas (requires ⊆ substrate + no-always-load)
        run: python scripts/check-personas.py
      - name: "check-governs-index (governs:/area: overlap + unknown-area)"
        run: python scripts/check-governs-index.py
      - name: check-vendored-parity (hook-config mode — 4 hook _resolve_vault_path copies)
        shell: bash
        run: bash scripts/check-vendored-parity.sh hook-config
      # verify-hook-resolution.sh ESCALATED-AND-PARKED (Loose Ends Release 3,
      # GH #70) rather than added here: it builds a scratch HOME via
      # mktemp -d, then invokes the hook .sh scripts, which shell out to
      # native (non-MSYS) python3.exe passing that HOME along — python3.exe
      # can't resolve git-bash's MSYS-style /tmp/tmp.XXXXX path back to the
      # real Windows filesystem location, so every hook sees a config file
      # that "isn't there" (confirmed via a real CI run, PR #358:
      # FileNotFoundError on .agentm-config.json under a git-bash /tmp
      # path). The other three verify-*.sh scripts below don't shell out to
      # python3 with a bash-side scratch-HOME path the same way, so they're
      # not known to share this blocker — left in to find out for real.
      # Needs either a cygpath -w translation at the git-bash/python
      # boundary or a Windows-native temp dir instead of mktemp; deferred
      # rather than guessed at without a real Windows+git-bash environment
      # to verify the fix against.
      - name: verify-state-routing (backend x project-mode matrix, never-demote)
        shell: bash
        run: bash scripts/verify-state-routing.sh
      - name: "Phase-lifecycle e2e, both state modes (verify-phases.sh)"
        shell: bash
        run: bash scripts/verify-phases.sh
      - name: "Memory-engine round-trip e2e (verify-memory-roundtrip.sh)"
        shell: bash
        run: bash scripts/verify-memory-roundtrip.sh
      - name: Unit tests — auto-discover every scripts/test_*.py
        # v4.5.1 task 1: use unittest discover so new test files are picked
        # up without a workflow edit. Closes pre-v4.5.1 CI gap where
        # test_install_migrate.py was invisible.
        # PowerShell on windows-latest: cd is invocation-scoped via parens.
        shell: pwsh
        run: |
          Push-Location scripts
          python -m unittest discover -p 'test_*.py'
          Pop-Location
